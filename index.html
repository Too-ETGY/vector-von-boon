<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Shape Canvas Studio</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>Vector Shape Studio</h1>
        <div class="header-actions">
            <button class="secondary" id="clear-btn">Clear Canvas</button>
            <button id="download-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download SVG
            </button>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div>
                <div class="section-title">Shapes Palette</div>
                <div class="palette-grid">
                    <div class="shape-item" draggable="true" data-shape="square">
                        <div class="shape-preview">
                            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                        </div>
                        <span class="shape-label">Square</span>
                    </div>
                    <div class="shape-item" draggable="true" data-shape="rectangle">
                        <div class="shape-preview">
                            <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/></svg>
                        </div>
                        <span class="shape-label">Rectangle</span>
                    </div>
                    <div class="shape-item" draggable="true" data-shape="circle">
                        <div class="shape-preview">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>
                        </div>
                        <span class="shape-label">Circle</span>
                    </div>
                    <div class="shape-item" draggable="true" data-shape="ellipse">
                        <div class="shape-preview">
                            <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10" ry="6"/></svg>
                        </div>
                        <span class="shape-label">Ellipse</span>
                    </div>
                    <div class="shape-item" draggable="true" data-shape="triangle">
                        <div class="shape-preview">
                            <svg viewBox="0 0 24 24"><polygon points="12,3 21,20 3,20"/></svg>
                        </div>
                        <span class="shape-label">Triangle</span>
                    </div>
                    <div class="shape-item" draggable="true" data-shape="star">
                        <div class="shape-preview">
                            <svg viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9"/></svg>
                        </div>
                        <span class="shape-label">Star</span>
                    </div>
                    <div class="shape-item" draggable="true" data-shape="polygon">
                        <div class="shape-preview">
                            <svg viewBox="0 0 24 24"><polygon points="12,2 22,8 22,16 12,22 2,16 2,8"/></svg>
                        </div>
                        <span class="shape-label">Hexagon</span>
                    </div>
                    <div class="shape-item" draggable="true" data-shape="heart">
                        <div class="shape-preview">
                            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        </div>
                        <span class="shape-label">Heart</span>
                    </div>
                </div>
            </div>

            <div class="global-controls">
                <div class="section-title">Canvas Settings</div>
                <div class="control-group">
                    <div class="control-row">
                        <label>Canvas Background</label>
                        <input type="color" id="bg-color-picker" value="#ffffff">
                    </div>
                </div>
            </div>
        </aside>

        <main class="canvas-area" id="canvas-area">
            <div id="drop-zone"></div>
        </main>

        <aside class="inspector" id="inspector-panel">
            <section class="layers-panel" aria-labelledby="layers-title">
                <div class="control-row">
                    <h2 class="section-title" id="layers-title">Layers</h2>
                    <span class="layers-count" id="layers-count">0</span>
                </div>
                <div class="layers-list" id="layers-list"></div>
            </section>
            <section class="properties-panel" aria-labelledby="properties-title">
                <h2 class="section-title" id="properties-title">Properties</h2>
                <div id="inspector-content">
                    <p class="placeholder-text">Select a shape on the canvas to customize its individual properties.</p>
                </div>
            </section>
            <div class="info-footer">
                Refreshing the page clears all artwork.
            </div>
        </aside>
    </div>
</body>
</html>
